name: Test Azure AI Samples

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test-python-samples:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_API_KEY" ] || [ -z "$AZURE_OPENAI_DEPLOYMENT_NAME" ]; then
            echo "Error: Required secrets are not configured."
            echo "Please ensure AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, and AZURE_OPENAI_DEPLOYMENT_NAME are set in repository secrets."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run import_azureopenai.py
        working-directory: python
        run: python import_azureopenai.py

      - name: Run import_openai_v0.py
        working-directory: python
        run: python import_openai_v0.py

      - name: Run import_openai_v1.py
        working-directory: python
        run: python import_openai_v1.py
