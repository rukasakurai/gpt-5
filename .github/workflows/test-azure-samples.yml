name: Test Azure Samples

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-samples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [azure-openai-service, azure-api-management]
      fail-fast: false
    environment: ${{ matrix.environment }}
    env:
      API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
      API_KEY: ${{ secrets.API_KEY }}
      MODEL_DEPLOYMENT_NAME: ${{ vars.MODEL_DEPLOYMENT_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Run import_azureopenai.py
        run: python python/import_azureopenai.py

      - name: Run import_openai_v0.py
        run: python python/import_openai_v0.py

      - name: Run import_openai_v1.py
        run: python python/import_openai_v1.py

      - name: Run responses/basic_text/main.py
        run: python python/responses/basic_text/main.py

      - name: Run responses/tool_calling/main.py
        run: python python/responses/tool_calling/main.py

      - name: Run agent_framework/main.py
        run: python python/agent_framework/main.py
